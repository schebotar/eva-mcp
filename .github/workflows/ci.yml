name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Типы и состав инструментов
        run: npm run check

      - name: Заглушка .env для smoke
        run: printf 'EVA_URL=https://example.invalid\nEVA_TOKEN=dummy\n' > .env

      - name: Старт сервера по stdio
        run: npm run smoke
