# Публикация релиза: тег vX.Y.Z → пакет в npm + страница релиза на GitHub.
#
# Триггер только по тегу: версию в npm не перезаписать, поэтому «на каждый мерж» не годится.
# Перед публикацией гоняются те же проверки, что в ci.yml, плюс две страховки: тег обязан
# стоять на master и совпадать с версией в package.json — публикация необратима, дешевле
# остановиться до неё.
#
# Аутентификация в npm — Trusted Publishing (OIDC), долгоживущего токена в secrets нет.
# Доверенный издатель заводится один раз и **только после первой публикации**: у несуществующего
# пакета настраивать нечего, `npm trust` отвечает 403 на `POST /-/package/<имя>/trust`.
# Поэтому дебютную версию публикуют вручную, а дальше выпуски делает этот workflow.
# Настройка: `npm trust github eva-mcp --file release.yml --repo schebotar/eva-mcp --allow-publish`.
#
# Шаг публикации пропускается, если версия уже есть в реестре: иначе дебютный тег падал бы
# на «cannot publish over the previously published versions», а перезапуск упавшего релиза
# был бы невозможен.
#
# Аттестация provenance при публикации по OIDC генерируется автоматически: флаг `--provenance`
# не нужен и вреден — он делает генерацию обязательной, и при несоблюдении условий публикация
# упадёт вместо того, чтобы пройти без аттестации.
#
# Запасной путь, если trusted publishing окажется недоступен: granular-токен на один пакет
# в секрете `NPM_TOKEN` и `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` в шаге публикации —
# с заметкой о ротации токена.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # создание GitHub Release
  id-token: write # OIDC для Trusted Publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # нужна история: проверяем, что тег на master

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Кеш зависимостей в релизной сборке не используем: он подмешивает в артефакт
          # то, что к тегу отношения не имеет (npm: «never use caching in release builds»).
          # У setup-node v5 кеш выключен по умолчанию, а в v6 включён — там нужен
          # явный `package-manager-cache: false`.
          registry-url: https://registry.npmjs.org

      - name: Тег стоит на master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Тег $GITHUB_REF_NAME не на master — релиз собирается только оттуда"
            exit 1
          fi

      - name: Версия тега совпадает с package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в package.json $expected — публикация остановлена"
            exit 1
          fi
          echo "Версия: $GITHUB_REF_NAME"

      - name: Зависимости
        run: npm ci

      # Trusted Publishing требует npm ≥ 11.5.1, в Node 22 идёт npm 10.x
      - name: npm для Trusted Publishing
        run: npm install -g npm@^11

      - name: Типы и состав инструментов
        run: npm run check

      - name: Заглушка .env для smoke
        run: printf 'EVA_URL=https://example.invalid\nEVA_TOKEN=dummy\n' > .env

      - name: Старт сервера по stdio
        run: npm run smoke

      - name: Состав пакета в лог
        run: npm pack --dry-run

      # Дебютную версию публикуют руками (см. заголовок файла), поэтому версия может быть
      # уже в реестре — тогда шаг публикации пропускается.
      - name: Версия уже в реестре?
        id: registry
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "eva-mcp@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::eva-mcp@$version уже в реестре — публикация пропускается"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Публикация в npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish --access public

      # Вехи названы коротко (v0.8), теги — полной версией (v0.8.0), поэтому ищем оба варианта.
      # Если вехи нет, релиз всё равно выходит: заметки соберутся из коммитов.
      - name: Заметки о вехе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          number="$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
            --jq "[.[] | select(.title == \"$GITHUB_REF_NAME\" or .title == \"v${version%.*}\")] | first | .number // empty")"
          if [ -z "$number" ]; then
            echo "Веха для $GITHUB_REF_NAME не найдена — заметки будут только из коммитов"
            exit 0
          fi
          title="$(gh api "repos/$GITHUB_REPOSITORY/milestones/$number" --jq '.title')"
          {
            echo "## Что вошло в веху \`$title\`"
            echo
            gh issue list --repo "$GITHUB_REPOSITORY" --state closed --milestone "$title" \
              --limit 100 --json number,title --jq '.[] | "- #\(.number) — \(.title)"'
            echo
          } > milestone-notes.md
          echo "Заметки о вехе собраны: $title"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Релиз $GITHUB_REF_NAME уже создан — шаг пропущен"
            exit 0
          fi
          if [ -f milestone-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file milestone-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
